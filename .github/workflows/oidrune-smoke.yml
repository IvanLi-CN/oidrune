name: Oidrune smoke

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: Optional paired gateway endpoint override.
        required: false
        type: string
        default: ""
      oidc_audience:
        description: Optional paired OIDC audience override.
        required: false
        type: string
        default: ""

permissions:
  id-token: write

jobs:
  notify:
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@911fca0a455f4bbef4b316d21eb7001eedcdc651
    with:
      outcome: success
      on_gateway_failure: fail
      summary: Oidrune release smoke test
      gateway_url: ${{ inputs.gateway_url }}
      oidc_audience: ${{ inputs.oidc_audience }}

  verify-delivery:
    needs: notify
    if: needs.notify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install smoke verification dependencies
        run: bun install --frozen-lockfile
      - name: Assert durable Telegram delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_SUMMARY: Oidrune release smoke test
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            result="$(bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --json --command "SELECT status, summary FROM notification_events WHERE run_id = '${GITHUB_RUN_ID}' AND summary = '${SMOKE_SUMMARY}' ORDER BY received_at DESC LIMIT 1")"
            status="$(jq -r '.[0].results[0].status // empty' <<<"${result}")"
            summary="$(jq -r '.[0].results[0].summary // empty' <<<"${result}")"
            if [[ "${status}" == "delivered" && "${summary}" == "${SMOKE_SUMMARY}" ]]; then
              echo "Smoke event delivered with the caller-provided body."
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::The smoke event was not durably delivered with the caller-provided body within 60 seconds."
          exit 1
