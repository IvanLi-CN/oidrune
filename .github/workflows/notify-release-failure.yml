name: Release Failure Notification

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: read
  id-token: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: ./.github/workflows/notify.yml
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: Release failed after CI Main; inspect the release workflow run for intent and commit context.
