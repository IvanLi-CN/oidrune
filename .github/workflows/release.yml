name: Release

on:
  workflow_run:
    workflows: [CI Main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: A validated merge commit to backfill.
        required: true
        type: string

permissions: {}

jobs:
  validate-release-target:
    name: Validate release target
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      intent: ${{ steps.target.outputs.intent }}
    steps:
      - name: Resolve a main release commit
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.merge_commit_sha }}
        with:
          script: |
            const sha = process.env.MANUAL_SHA || process.env.WORKFLOW_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha ?? "")) {
              throw new Error("Expected a 40-character lowercase Git commit SHA.");
            }
            const { data: comparison } = await github.rest.repos.compareCommits({ owner: context.repo.owner, repo: context.repo.repo, base: sha, head: "main" });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error(`Release target ${sha} is not reachable from main.`);
            }
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha });
            const merged = pullRequests.find((pr) => pr.merged_at && pr.base.ref === "main");
            if (!merged) {
              throw new Error(`No merged main PR is associated with ${sha}.`);
            }
            const labels = merged.labels.map((label) => label.name);
            const intent = labels.filter((label) => ["type:major", "type:minor", "type:patch", "type:skip"].includes(label));
            if (intent.length !== 1 || !labels.includes("channel:stable")) {
              throw new Error("Validated release labels are absent from the merge commit.");
            }
            core.setOutput("sha", sha);
            core.setOutput("intent", intent[0]);

  release:
    needs: validate-release-target
    if: needs.validate-release-target.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install release infrastructure
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        env:
          ACCESS_AUD: ${{ vars.OIDRUNE_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo 'D1 database_id is still the unprovisioned placeholder.' >&2
            exit 1
          fi
          if [[ -z "${ACCESS_AUD}" || -z "${ACCESS_TEAM_DOMAIN}" ]]; then
            echo 'OIDRUNE_ACCESS_AUD and OIDRUNE_ACCESS_TEAM_DOMAIN repository variables are required.' >&2
            exit 1
          fi
      - name: Ensure trusted-release schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          result="$(bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --json --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'trusted_workflow_releases' LIMIT 1")"
          table_name="$(jq -r '.[0].results[0].name // empty' <<<"${result}")"
          if [[ "${table_name}" != "trusted_workflow_releases" ]]; then
            bun ./node_modules/wrangler/bin/wrangler.js d1 migrations apply oidrune --remote
          fi
      - name: Refuse a revoked workflow release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERGE_SHA: ${{ needs.validate-release-target.outputs.sha }}
        run: |
          set -euo pipefail
          result="$(bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --json --command "SELECT revoked_at FROM trusted_workflow_releases WHERE sha = '${MERGE_SHA}' LIMIT 1")"
          revoked_at="$(jq -r '.[0].results[0].revoked_at // empty' <<<"${result}")"
          if [[ -n "${revoked_at}" ]]; then
            echo 'The workflow release was revoked by an operator.' >&2
            exit 1
          fi
      - name: Checkout validated release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-release-target.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install validated release
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        env:
          ACCESS_AUD: ${{ vars.OIDRUNE_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo 'D1 database_id is still the unprovisioned placeholder.' >&2
            exit 1
          fi
          if [[ -z "${ACCESS_AUD}" || -z "${ACCESS_TEAM_DOMAIN}" ]]; then
            echo 'OIDRUNE_ACCESS_AUD and OIDRUNE_ACCESS_TEAM_DOMAIN repository variables are required.' >&2
            exit 1
          fi
      - name: Apply validated release D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ./node_modules/wrangler/bin/wrangler.js d1 migrations apply oidrune --remote
      - name: Prepare release snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERGE_SHA: ${{ needs.validate-release-target.outputs.sha }}
          INTENT: ${{ needs.validate-release-target.outputs.intent }}
        run: |
          bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --command "INSERT INTO release_snapshots (merge_commit_sha, release_intent, workflow_sha, status, created_at, updated_at) VALUES ('${MERGE_SHA}', '${INTENT}', '${MERGE_SHA}', 'prepared', datetime('now'), datetime('now')) ON CONFLICT(merge_commit_sha) DO UPDATE SET release_intent=excluded.release_intent, workflow_sha=excluded.workflow_sha, status='prepared', updated_at=datetime('now')"
      - name: Build Console assets
        run: bun run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ACCESS_AUD:${{ vars.OIDRUNE_ACCESS_AUD }} --var ACCESS_TEAM_DOMAIN:${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
      - name: Verify production route boundaries
        run: |
          set -euo pipefail
          origin='https://oidrune.707979.xyz'
          root_headers="$(curl --silent --show-error --max-time 10 --output /dev/null --dump-header - "${origin}/")"
          root_status="$(awk 'NR == 1 { print $2 }' <<<"${root_headers}")"
          root_location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' <<<"${root_headers}")"
          console_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${origin}/console/")"
          if [[ "${root_status}" != '302' || "${root_location}" != '/console/' ]]; then
            echo 'The production root does not redirect to the protected console.' >&2
            exit 1
          fi
          if [[ "${console_status}" != '302' ]]; then
            echo 'The production console is not protected by Cloudflare Access.' >&2
            exit 1
          fi
      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ needs.validate-release-target.outputs.sha }}
          generate_release_notes: true
      - name: Promote trusted reusable workflow release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERGE_SHA: ${{ needs.validate-release-target.outputs.sha }}
        run: |
          bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --command "INSERT INTO trusted_workflow_releases (sha, created_by, revoked_at, revoked_by) VALUES ('${MERGE_SHA}', 'release-automation', NULL, NULL) ON CONFLICT(sha) DO NOTHING; UPDATE release_snapshots SET workflow_sha='${MERGE_SHA}', status='deployed', updated_at=datetime('now') WHERE merge_commit_sha='${MERGE_SHA}'"

  close-failed-release-snapshot:
    needs: [validate-release-target, release]
    if: always() && needs.release.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install release infrastructure
        run: bun install --frozen-lockfile
      - name: Fail closed release snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERGE_SHA: ${{ needs.validate-release-target.outputs.sha }}
        run: |
          bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --command "UPDATE release_snapshots SET status='failed', updated_at=datetime('now') WHERE merge_commit_sha='${MERGE_SHA}' AND status='prepared'"

  release-failure-notification:
    name: Release Failure Notification
    needs:
      [validate-release-target, release, close-failed-release-snapshot]
    if: always() && (needs.validate-release-target.result == 'failure' || needs.release.result == 'failure')
    permissions:
      contents: none
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@911fca0a455f4bbef4b316d21eb7001eedcdc651
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: Release failed after CI Main; inspect the release workflow run for intent and commit context.
