name: Release

on:
  workflow_run:
    workflows: [CI Main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: A validated merge commit to backfill.
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve merge commit
        id: commit
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.merge_commit_sha }}
        run: |
          sha="${MANUAL_SHA:-$WORKFLOW_SHA}"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Expected a 40-character lowercase Git commit SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Resolve immutable release intent
        id: intent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const sha = process.env.MERGE_SHA;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha });
            const merged = pullRequests.find((pr) => pr.merged_at);
            if (!merged) core.setFailed(`No merged PR is associated with ${sha}.`);
            const labels = merged.labels.map((label) => label.name);
            const intent = labels.filter((label) => ["type:major", "type:minor", "type:patch", "type:skip"].includes(label));
            if (intent.length !== 1 || !labels.includes("channel:stable")) core.setFailed("Validated release labels are absent from the merge commit.");
            return intent[0];
        env:
          MERGE_SHA: ${{ steps.commit.outputs.sha }}
      - name: Snapshot release intent
        env:
          MERGE_SHA: ${{ steps.commit.outputs.sha }}
          INTENT: ${{ steps.intent.outputs.result }}
        run: |
          bunx wrangler d1 execute oidrune --remote --command "INSERT INTO release_snapshots (merge_commit_sha, release_intent, workflow_sha, status, created_at, updated_at) VALUES ('${MERGE_SHA}', '${INTENT}', '${MERGE_SHA}', 'prepared', datetime('now'), datetime('now')) ON CONFLICT(merge_commit_sha) DO UPDATE SET release_intent=excluded.release_intent, updated_at=excluded.updated_at"
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Promote trusted reusable workflow release
        env:
          MERGE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          bunx wrangler d1 execute oidrune --remote --command "INSERT INTO trusted_workflow_releases (sha, created_by, revoked_at, revoked_by) VALUES ('${MERGE_SHA}', 'release-automation', NULL, NULL) ON CONFLICT(sha) DO UPDATE SET revoked_at=NULL, revoked_by=NULL; UPDATE release_snapshots SET workflow_sha='${MERGE_SHA}', status='deployed', updated_at=datetime('now') WHERE merge_commit_sha='${MERGE_SHA}'"
      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true
