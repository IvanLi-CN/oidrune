name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-release-request:
    name: Validate manual release request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - name: Validate generated version, main target, and CI Main
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const runNumber = Number(process.env.RELEASE_RUN_NUMBER);
            if (!Number.isSafeInteger(runNumber) || runNumber < 1) {
              throw new Error("The workflow run number must be a positive integer.");
            }

            const version = `0.1.${runNumber}`;
            const tagName = `v${version}`;
            const sha = process.env.TARGET_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha ?? "")) {
              throw new Error("The workflow target must be a 40-character lowercase Git commit SHA.");
            }

            const { data: mainRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            if (mainRef.object.sha !== sha) {
              throw new Error(`The manual run target ${sha} is not the current main commit ${mainRef.object.sha}.`);
            }

            const mainRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci-main.yml",
                head_sha: sha,
                status: "completed",
                per_page: 100,
              },
            );
            if (!mainRuns.some((run) => run.head_sha === sha && run.conclusion === "success")) {
              throw new Error(`CI Main has not passed for ${sha}; no release side effect is allowed.`);
            }

            async function resolveTagTarget() {
              let reference;
              try {
                ({ data: reference } = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                }));
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }

              let object = reference.object;
              for (let depth = 0; depth < 3; depth += 1) {
                if (object.type === "commit") return object.sha;
                if (object.type !== "tag") {
                  throw new Error(`The ${tagName} ref resolves to unsupported object type ${object.type}.`);
                }
                const { data: tag } = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: object.sha,
                });
                object = tag.object;
              }
              throw new Error(`The ${tagName} ref has too many annotated tag layers.`);
            }

            const tagTarget = await resolveTagTarget();
            if (tagTarget && tagTarget !== sha) {
              throw new Error(`The ${tagName} tag already points to ${tagTarget}, not ${sha}.`);
            }

            let release = null;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !tagTarget) {
              throw new Error(`The ${tagName} release exists but its tag cannot be resolved.`);
            }

            const stableTagPattern = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const conflictingTag = tags.find(
              (tag) => stableTagPattern.test(tag.name) && tag.name !== tagName && tag.commit?.sha === sha,
            );
            if (conflictingTag) {
              throw new Error(`The main commit ${sha} already has stable release tag ${conflictingTag.name}.`);
            }

            core.info(`Validated manual release ${tagName} for main commit ${sha}. Existing matching tag or release will be reused.`);
            core.setOutput("sha", sha);
            core.setOutput("version", version);
            core.setOutput("tag", tagName);

  release:
    needs: validate-release-request
    if: needs.validate-release-request.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install release infrastructure
        run: bun install --frozen-lockfile
      - name: Validate production configuration
        env:
          ACCESS_AUD: ${{ vars.OIDRUNE_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo 'D1 database_id is still the unprovisioned placeholder.' >&2
            exit 1
          fi
          if [[ -z "${ACCESS_AUD}" || -z "${ACCESS_TEAM_DOMAIN}" ]]; then
            echo 'OIDRUNE_ACCESS_AUD and OIDRUNE_ACCESS_TEAM_DOMAIN repository variables are required.' >&2
            exit 1
          fi
      - name: Ensure trusted-release schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          result="$(bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --json --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'trusted_workflow_releases' LIMIT 1")"
          table_name="$(jq -r '.[0].results[0].name // empty' <<<"${result}")"
          if [[ "${table_name}" != "trusted_workflow_releases" ]]; then
            bun ./node_modules/wrangler/bin/wrangler.js d1 migrations apply oidrune --remote
          fi
      - name: Refuse a revoked workflow release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ needs.validate-release-request.outputs.sha }}
        run: |
          set -euo pipefail
          result="$(bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --json --command "SELECT revoked_at FROM trusted_workflow_releases WHERE sha = '${TARGET_SHA}' LIMIT 1")"
          revoked_at="$(jq -r '.[0].results[0].revoked_at // empty' <<<"${result}")"
          if [[ -n "${revoked_at}" ]]; then
            echo 'The workflow release was revoked by an operator.' >&2
            exit 1
          fi
      - name: Checkout validated release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-release-request.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install validated release
        run: bun install --frozen-lockfile
      - name: Validate target production configuration
        env:
          ACCESS_AUD: ${{ vars.OIDRUNE_ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo 'D1 database_id is still the unprovisioned placeholder.' >&2
            exit 1
          fi
          if [[ -z "${ACCESS_AUD}" || -z "${ACCESS_TEAM_DOMAIN}" ]]; then
            echo 'OIDRUNE_ACCESS_AUD and OIDRUNE_ACCESS_TEAM_DOMAIN repository variables are required.' >&2
            exit 1
          fi
      - name: Apply validated release D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ./node_modules/wrangler/bin/wrangler.js d1 migrations apply oidrune --remote
      - name: Build Console assets
        run: bun run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ACCESS_AUD:${{ vars.OIDRUNE_ACCESS_AUD }} --var ACCESS_TEAM_DOMAIN:${{ vars.OIDRUNE_ACCESS_TEAM_DOMAIN }}
      - name: Verify production route boundaries
        run: |
          set -euo pipefail
          origin='https://oidrune.707979.xyz'
          root_headers="$(curl --silent --show-error --max-time 10 --output /dev/null --dump-header - "${origin}/")"
          root_status="$(awk 'NR == 1 { print $2 }' <<<"${root_headers}")"
          root_location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' <<<"${root_headers}")"
          console_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${origin}/console/")"
          if [[ "${root_status}" != '302' || "${root_location}" != '/console/' ]]; then
            echo 'The production root does not redirect to the protected console.' >&2
            exit 1
          fi
          if [[ "${console_status}" != '302' ]]; then
            echo 'The production console is not protected by Cloudflare Access.' >&2
            exit 1
          fi
      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.validate-release-request.outputs.tag }}
          target_commitish: ${{ needs.validate-release-request.outputs.sha }}
          generate_release_notes: true
      - name: Promote trusted reusable workflow release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_SHA: ${{ needs.validate-release-request.outputs.sha }}
        run: |
          bun ./node_modules/wrangler/bin/wrangler.js d1 execute oidrune --remote --command "INSERT INTO trusted_workflow_releases (sha, created_by, revoked_at, revoked_by) VALUES ('${TARGET_SHA}', 'release-automation', NULL, NULL) ON CONFLICT(sha) DO NOTHING"

  release-failure-notification:
    name: Release Failure Notification
    needs: [validate-release-request, release]
    if: always() && needs.validate-release-request.result == 'success' && needs.release.result == 'failure'
    permissions:
      contents: none
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@911fca0a455f4bbef4b316d21eb7001eedcdc651
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: Manual release ${{ needs.validate-release-request.outputs.tag }} failed for ${{ needs.validate-release-request.outputs.sha }}; inspect the Release workflow run.
